  List<Map<String, dynamic>> _filteredLocations = [];

  @override
  void initState() {
    super.initState();
    _filteredLocations = _moroccoLocations;
  }

  void _filterSearch(String query) {
    setState(() {
      if (query.isEmpty) {
        _filteredLocations = _moroccoLocations;
      } else {
        _filteredLocations = _moroccoLocations
            .where((item) => item['name'].toString().contains(query))
            .toList();
      }
    });
  }

  void _moveToLocation(LatLng location) {
    _mapController.move(location, 11.0);
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('خريطة جهات وأقاليم المغرب 🇲🇦'),
        centerTitle: true,
        backgroundColor: Colors.teal.shade900,
      ),
      body: Stack(
        children: [
          FlutterMap(
            mapController: _mapController,
            options: MapOptions(
              initialCenter: _centerMorocco,
              initialZoom: 5.8,
            ),
            children: [
              TileLayer(
                urlTemplate: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                userAgentPackageName: 'com.mohammedbous414.map_explorer_app',
              ),
              MarkerLayer(
                markers: _moroccoLocations.map((item) {
                  return Marker(
                    point: item['location'],
                    width: 75,
                    height: 55,
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Icon(
                          Icons.location_on,
                          color: Colors.redAccent,
                          size: 26,
                        ),
                        Container(
                          padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 1),
                          decoration: BoxDecoration(
                            color: Colors.black87,
                            borderRadius: BorderRadius.circular(4),
                            border: Border.all(color: Colors.tealAccent, width: 0.5),
                          ),
                          child: Text(
                            item['name'],
                            textAlign: TextAlign.center,
                            style: const TextStyle(
                              color: Colors.white,
                              fontSize: 8.5,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                        ),
                      ],
                    ),
                  );
                }).toList(),
              ),
            ],
          ),
          Positioned(
            top: 10,
            left: 15,
            right: 15,
            child: Card(
              color: Colors.black.withOpacity(0.85),
              child: TextField(
                onChanged: _filterSearch,
                style: const TextStyle(color: Colors.white),
                decoration: const InputDecoration(
                  hintText: 'ابحث عن إقليم أو جهة...',
                  hintStyle: TextStyle(color: Colors.grey),
                  prefixIcon: Icon(Icons.search, color: Colors.tealAccent),
                  border: InputBorder.none,
                  contentPadding: EdgeInsets.all(12),
                ),
              ),
            ),
          ),
          if (_filteredLocations.length < _moroccoLocations.length && _filteredLocations.isNotEmpty)
            Positioned(
              top: 70,
              left: 20,
              right: 20,
              child: Container(
                maxHeight: 200,
                color: Colors.black90,
                child: ListView.builder(
                  shrinkWrap: true,
                  itemCount: _filteredLocations.length,
                  itemBuilder: (context, index) {
                    final item = _filteredLocations[index];
                    return ListTile(
                      title: Text(item['name'], style: const TextStyle(color: Colors.white)),
                      subtitle: Text(item['type'], style: const TextStyle(color: Colors.tealAccent, fontSize: 11)),
                      onTap: () {
                        _moveToLocation(item['location']);
                        setState(() {
                          _filteredLocations = _moroccoLocations;
                        });
                      },
                    );
                  },
                ),
              ),
            ),
        ],
