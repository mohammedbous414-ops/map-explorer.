import 'package:flutter/material.dart';
import 'package:flutter_map/flutter_map.dart';
import 'package:latlong2/latlong.dart';
import 'package:geolocator/geolocator.dart';

void main() {
  runApp(const MapApp());
}

class MapApp extends StatelessWidget {
  const MapApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'خريطة ورحلات المغرب',
      theme: ThemeData(
        useMaterial3: true,
        colorScheme: ColorScheme.fromSeed(
          seedColor: Colors.teal,
          brightness: Brightness.dark,
        ),
      ),
      home: const MapScreen(),
    );
  }
}

class MapScreen extends StatefulWidget {
  const MapScreen({super.key});

  @override
  State<MapScreen> createState() => _MapScreenState();
}

class _MapScreenState extends State<MapScreen> {
  final MapController _mapController = MapController();
  final LatLng _centerMorocco = const LatLng(31.7917, -7.0926);

  LatLng? _currentLocation;
  LatLng? _tripDestination;
  String _tripDestinationName = '';

  final List<Map<String, dynamic>> _moroccoLocations = [
    // جهة طنجة تطوان الحسيمة
    {'name': 'طنجة', 'type': 'مركز جهة / إقليم', 'location': const LatLng(35.7595, -5.8340)},
    {'name': 'تطوان', 'type': 'إقليم', 'location': const LatLng(35.5889, -5.3626)},
    {'name': 'الحسيمة', 'type': 'إقليم', 'location': const LatLng(35.2472, -3.9321)},
    {'name': 'العرائش', 'type': 'إقليم', 'location': const LatLng(35.1932, -6.1558)},
    {'name': 'شفشاون', 'type': 'إقليم', 'location': const LatLng(35.1713, -5.2697)},
    {'name': 'وزان', 'type': 'إقليم', 'location': const LatLng(34.7981, -5.5812)},

    // جهة الشرق
    {'name': 'وجدة', 'type': 'مركز جهة / إقليم', 'location': const LatLng(34.6814, -1.9086)},
    {'name': 'الناظور', 'type': 'إقليم', 'location': const LatLng(35.1681, -2.9335)},
    {'name': 'بركان', 'type': 'إقليم', 'location': const LatLng(34.9197, -2.3225)},

    // جهة فاس مكناس
    {'name': 'فاس', 'type': 'مركز جهة / إقليم', 'location': const LatLng(34.0331, -5.0003)},
    {'name': 'مكناس', 'type': 'إقليم', 'location': const LatLng(33.8935, -5.5473)},
    {'name': 'إفران', 'type': 'إقليم', 'location': const LatLng(33.5228, -5.1105)},

    // جهة الرباط سلا القنيطرة
    {'name': 'الرباط', 'type': 'عاصمة / مركز جهة', 'location': const LatLng(34.0209, -6.8416)},
    {'name': 'سلا', 'type': 'إقليم', 'location': const LatLng(34.0339, -6.8000)},
    {'name': 'القنيطرة', 'type': 'إقليم', 'location': const LatLng(34.2610, -6.5802)},

    // جهة الدار البيضاء سطات
    {'name': 'الدار البيضاء', 'type': 'مركز جهة / العاصمة الاقتصادية', 'location': const LatLng(33.5731, -7.5898)},
    {'name': 'سطات', 'type': 'إقليم', 'location': const LatLng(33.0016, -7.6166)},
    {'name': 'الجديدة', 'type': 'إقليم', 'location': const LatLng(33.2316, -8.5007)},

    // جهة مراكش آسفي
    {'name': 'مراكش', 'type': 'مركز جهة / عمالة', 'location': const LatLng(31.6295, -7.9811)},
    {'name': 'آسفي', 'type': 'إقليم', 'location': const LatLng(32.2994, -9.2372)},
    {'name': 'الصويرة', 'type': 'إقليم', 'location': const LatLng(31.5085, -9.7595)},

    // جهة سوس ماسة
    {'name': 'أكادير', 'type': 'مركز جهة / عمالة', 'location': const LatLng(30.4278, -9.5981)},
    {'name': 'تارودانت', 'type': 'إقليم', 'location': const LatLng(30.4703, -8.8770)},

    // الصحراء المغربية
    {'name': 'العيون', 'type': 'مركز جهة / إقليم', 'location': const LatLng(27.1253, -13.1625)},
    {'name': 'الداخلة', 'type': 'مركز جهة / إقليم', 'location': const LatLng(23.6848, -15.9579)},
  ];

  List<Map<String, dynamic>> _filteredLocations = [];

  @override
  void initState() {
    super.initState();
    _filteredLocations = _moroccoLocations;
  }

  void _filterSearch(String query) {
    setState(() {
      if (query.isEmpty) {
        _filteredLocations = _moroccoLocations;
      } else {
        _filteredLocations = _moroccoLocations
            .where((item) => item['name'].toString().contains(query))
            .toList();
      }
    });
  }

  Future<void> _determinePosition() async {
    bool serviceEnabled;
    LocationPermission permission;

    serviceEnabled = await Geolocator.isLocationServiceEnabled();
    if (!serviceEnabled) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('المرجو تفعيل خدمة الـ GPS في الهاتف')),
      );
      return;
    }

    permission = await Geolocator.checkPermission();
    if (permission == LocationPermission.denied) {
      permission = await Geolocator.requestPermission();
      if (permission == LocationPermission.denied) {
        ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(content: Text('تم رفض صلاحية الوصول للموقع')),
        );
        return;
      }
    }

    Position position = await Geolocator.getCurrentPosition(
        desiredAccuracy: LocationAccuracy.high);

    setState(() {
      _currentLocation = LatLng(position.latitude, position.longitude);
    });

    _mapController.move(_currentLocation!, 13.0);
  }

  void _startTripTo(Map<String, dynamic> item) {
    if (_currentLocation == null) {
      _determinePosition().then((_) {
        if (_currentLocation != null) {
          _setTrip(item);
        }
      });
    } else {
      _setTrip(item);
    }
  }

  void _setTrip(Map<String, dynamic> item) {
    setState(() {
      _tripDestination = item['location'];
      _tripDestinationName = item['name'];
      _filteredLocations = _moroccoLocations;
    });

    _mapController.move(_currentLocation!, 7.0);

    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(content: Text('تم تحديد مسار الرحلة نحو $_tripDestinationName 🚗')),
    );
  }

  void _clearTrip() {
    setState(() {
      _tripDestination = null;
      _tripDestinationName = '';
    });
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('مستكشف الخرائط والرحلات 🇲🇦'),
        centerTitle: true,
        backgroundColor: Colors.teal.shade900,
        actions: [
          if (_tripDestination != null)
            IconButton(
              icon: const Icon(Icons.clear_all, color: Colors.orangeAccent),
              onPressed: _clearTrip,
              tooltip: 'إلغاء الرحلة',
            ),
        ],
      ),
      body: Stack(
        children: [
          FlutterMap(
            mapController: _mapController,
            options: MapOptions(
              initialCenter: _centerMorocco,
              initialZoom: 5.8,
            ),
            children: [
              TileLayer(
                urlTemplate: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
                subdomains: const ['a', 'b', 'c', 'd'],
                userAgentPackageName: 'com.example.map_explorer',
              ),
              if (_currentLocation != null && _tripDestination != null)
                PolylineLayer(
                  polylines: [
                    Polyline(
                      points: [_currentLocation!, _tripDestination!],
                      strokeWidth: 4.5,
                      color: Colors.cyanAccent,
                    ),
                  ],
                ),
              MarkerLayer(
                markers: [
                  ..._moroccoLocations.map((item) {
                    return Marker(
                      point: item['location'],
                      width: 75,
                      height: 55,
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const Icon(Icons.location_on, color: Colors.redAccent, size: 24),
                          Container(
                            padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 1),
                            decoration: BoxDecoration(
                              color: Colors.black87,
                              borderRadius: BorderRadius.circular(4),
                            ),
                            child: Text(
                              item['name'],
                              style: const TextStyle(color: Colors.white, fontSize: 8, fontWeight: FontWeight.bold),
                            ),
                          ),
                        ],
                      ),
                    );
                  }),
                  if (_currentLocation != null)
                    Marker(
                      point: _currentLocation!,
                      width: 50,
                      height: 50,
                      child: const Icon(
                        Icons.my_location,
                        color: Colors.blueAccent,
                        size: 32,
                      ),
                    ),
                ],
              ),
            ],
          ),
          Positioned(
            top: 10,
            left: 15,
            right: 15,
            child: Card(
              color: Colors.black.withOpacity(0.85),
              child: TextField(
                onChanged: _filterSearch,
                style: const TextStyle(color: Colors.white),
                decoration: const InputDecoration(
                  hintText: 'ابحث عن إقليم أو وجهة رحلة...',
                  hintStyle: TextStyle(color: Colors.grey),
                  prefixIcon: Icon(Icons.search, color: Colors.tealAccent),
                  border: InputBorder.none,
                  contentPadding: EdgeInsets.all(12),
                ),
              ),
            ),
          ),
          if (_filteredLocations.length < _moroccoLocations.length && _filteredLocations.isNotEmpty)
            Positioned(
              top: 70,
              left: 20,
              right: 20,
              child: Container(
                maxHeight: 250,
                color: Colors.black90,
                child: ListView.builder(
                  shrinkWrap: true,
                  itemCount: _filteredLocations.length,
                  itemBuilder: (context, index) {
                    final item = _filteredLocations[index];
                    return ListTile(
                      title: Text(item['name'], style: const TextStyle(color: Colors.white)),
                      subtitle: Text(item['type'], style: const TextStyle(color: Colors.tealAccent, fontSize: 11)),
                      trailing: ElevatedButton.icon(
                        icon: const Icon(Icons.directions_car, size: 16),
                        label: const Text('رحلة', style: TextStyle(fontSize: 11)),
                        style: ElevatedButton.styleFrom(
                          backgroundColor: Colors.teal.shade700,
                          foregroundColor: Colors.white,
                        ),
                        onPressed: () => _startTripTo(item),
                      ),
                      onTap: () {
                        _mapController.move(item['location'], 11.0);
                        setState(() {
                          _filteredLocations = _moroccoLocations;
                        });
                      },
                    );
                  },
                ),
              ),
            ),
        ],
      ),
      floatingActionButton: FloatingActionButton.extended(
        onPressed: _determinePosition,
        backgroundColor: Colors.tealAccent.shade700,
        icon: const Icon(Icons.gps_fixed, color: Colors.white),
        label: const Text('موقعي الحالي', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
      ),
    );
  }
}
